{% extends "core/base.html" %}

{% block contenido %}
    {% if form.instance.pk %}
        <h1>Clientes - Editar</h1>
    {% else %}
        <h1>Clientes - Crear</h1>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <button type="submit">Enviar datos</button>
    </form>
    <a href="{% url 'servicios:cliente_list' %}">Volver</a>
{% endblock contenido %}
