{% extends "core/base.html" %}

{% block contenido %}
    <main class="pagina">
        {% if form.instance.pk %}
            <div class="pagina-head">
                <h1>Clientes - Editar</h1>
            </div>
        {% else %}
            <div class="pagina-head">
                <h1>Clientes - Crear</h1>
            </div>
        {% endif %}
        <form method="post" class="form-card">
            {% csrf_token %}
            <table>
                {{ form.as_table }}
            </table>
            <div class="form-acciones">
                <button class="btn btn-primary" type="submit">Enviar datos</button>
            </div>
        </form>
        <a class="btn btn-light enlace-volver" href="{% url 'servicios:cliente_list' %}">Volver</a>
    </main>
{% endblock contenido %}
