{% comment %}
    Componente de acciones con iconos para tablas de listado.
    Uso: {% include "servicios/acciones.html" with entidad="cliente" objeto=cliente %}
    Requiere: entidad (prefijo de URL) y objeto (con atributo id).
{% endcomment %}
<span class="acciones">
    <a class="accion accion-ver"
       href="{% url 'servicios:'|add:entidad|add:'_detail' objeto.id %}"
       title="Ver"
       aria-label="Ver">
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
        </svg>
        <span class="sr-only">Ver</span>
    </a>
    <a class="accion accion-editar"
       href="{% url 'servicios:'|add:entidad|add:'_update' objeto.id %}"
       title="Editar"
       aria-label="Editar">
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             aria-hidden="true">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
        <span class="sr-only">Editar</span>
    </a>
    <a class="accion accion-eliminar"
       href="{% url 'servicios:'|add:entidad|add:'_delete' objeto.id %}"
       title="Eliminar"
       aria-label="Eliminar">
        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             aria-hidden="true">
            <path d="M3 6h18" />
            <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6" />
            <path d="M14 11v6" />
        </svg>
        <span class="sr-only">Eliminar</span>
    </a>
</span>
