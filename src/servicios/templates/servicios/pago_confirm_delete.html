{% extends "core/base.html" %}
{% block contenido %}
    <main class="pagina">
        <div class="pagina-head">
            <h1>Pagos - Eliminar</h1>
        </div>
        <div class="confirmar-card">
            <p>¿Estás seguro de eliminar "{{ pago }}"?</p>
            <form method="post" class="confirmar-acciones">
                {% csrf_token %}
                <button class="btn btn-danger" type="submit">Sí, confirmo</button>
                <a class="btn btn-light" href="{% url 'servicios:pago_list' %}">Cancelar</a>
            </form>
        </div>
    </main>
{% endblock contenido %}
