{% extends "core/base.html" %}
{% block contenido %}
    <main class="pagina">
        <div class="pagina-head">
            <h1>Panel de Servicios</h1>
        </div>
        <div class="opciones-grid">
            <section class="opcion-card">
                <h2>Servicios</h2>
                <a class="opcion-link" href="{% url 'servicios:servicio_list' %}">Listar Servicios</a>
                <a class="opcion-link" href="{% url 'servicios:servicio_create' %}">Crear Servicio</a>
            </section>
            <section class="opcion-card">
                <h2>Clientes</h2>
                <a class="opcion-link" href="{% url 'servicios:cliente_list' %}">Listar Clientes</a>
                <a class="opcion-link" href="{% url 'servicios:cliente_create' %}">Crear Cliente</a>
            </section>
            <section class="opcion-card">
                <h2>Solicitudes de servicio</h2>
                <a class="opcion-link" href="{% url 'servicios:solicitud_list' %}">Listar Solicitudes</a>
                <a class="opcion-link" href="{% url 'servicios:solicitud_create' %}">Crear Solicitud</a>
            </section>
            <section class="opcion-card">
                <h2>Pagos</h2>
                <a class="opcion-link" href="{% url 'servicios:pago_list' %}">Listar Pagos</a>
                <a class="opcion-link" href="{% url 'servicios:pago_create' %}">Crear Pago</a>
            </section>
        </div>
        <a class="btn btn-light enlace-volver" href="{% url 'core:index' %}">Volver</a>
    </main>
{% endblock contenido %}
