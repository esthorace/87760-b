{% extends "core/base.html" %}
{% block contenido %}
    <main class="pagina">
        <div class="pagina-head">
            <h1>Servicios - Ver</h1>
            {% include "servicios/acciones.html" with entidad="servicio" objeto=servicio %}
        </div>
        <ul class="lista-datos">
            <li><strong>Nombre:</strong> {{ servicio.nombre }}</li>
            <li><strong>Descripción:</strong> {{ servicio.descripcion|default:"-" }}</li>
        </ul>
        <a class="btn btn-light enlace-volver" href="{% url 'servicios:servicio_list' %}">Volver</a>
    </main>
{% endblock contenido %}
